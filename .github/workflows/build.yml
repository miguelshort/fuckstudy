nombre: Comppilar fuckstudy

en:
  empujar:
  solicitud de extracción:
  flujo_de_trabajo:

concurrencia:
  grupo: build-${{ github.ref }}
  cancelación en curso: verdadero

empleos:
  construir:
    runs-on: ubuntu-latest
    minutos de tiempo de espera: 45

    pasos:
      - nombre: Descargar el código
        Usos: acciones/checkout@v4

      # Busca la carpeta del proyecto (la que tiene settings.gradle.kts), esté en la raíz
      # del repositorio, en una subcarpeta («minibunker/») o dentro de un ZIP subido tal cual.
      - name: Localizar el proyecto
        id: loc
        correr: |
          f=$(find . -maxdepth 4 -name settings.gradle.kts -not -path "*/build/*" -not -path "./_proyecto/*" | head -n 1)
          si [ -z "$f" ]; entonces
            # Prioridad: fuckstudy.zip; si no está, el primer .zip que haya (p. ej. un minibunker.zip antiguo).
            z=$(find . -maxdepth 2 -iname "fuckstudy*.zip" -not -path "./.git/*" | head -n 1)
            [ -z "$z" ] && z=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)
            si [ -n "$z" ]; entonces
              echo "Descomprimiendo $z"
              rm -rf _proyecto && mkdir -p _proyecto && descomprimir -q -o "$z" -d _proyecto
              f=$(find _proyecto -maxdepth 4 -name settings.gradle.kts -not -path "*/build/*" | head -n 1)
            fi
          fi
          si [ -z "$f" ]; entonces
            echo "::error::No encuentro settings.gradle.kts. Sube fuckstudy.zip o el contenido de su carpeta (settings.gradle.kts, build.gradle.kts, app/...)."
            echo "Contenido del repositorio:"; encontrar . -max Depth 3 -not -path "./.git*" | cabeza -n 80
            Salida 1
          fi
          dir=$(dirname "$f")
          echo "Proyecto en: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          ls -la "$dir" "$dir/app"

      - nombre: Instalar JDK 17
        Usos: actions/setup-java@v4
        con:
          distribución: temurin
          versión de Java: '17'

      - nombre: Instalar Android SDK (API 35)
        Usos: android-actions/setup-android@v3
        con:
          paquetes: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # Gradle 8.14.3 directamente (misma versión que el wrapper): no depende del permiso
      # de ejecución de gradlew ni de la validación de su .jar.
      - nombre: Preparar Gradle 8.14.3
        Usos: gradle/actions/setup-gradle@v4
        con:
          Versión de Gradle: '8.14.3'
          directorio raíz de compilación: ${{ steps.loc.outputs.dir }}

      # Si falla, los errores reales (líneas «e: …» de Kotlin y «What gone mal» de Gradle) se muestran
      # arriba del todo como anotaciones y en el resumen de la ejecución, sin buscar en el registro.
      - nombre: Compilar el APK de depuración
        directorio de trabajo: ${{ steps.loc.outputs.dir }}
        shell: bash
        correr: |
          establecer -o fallo de tubería
          if gradle assembleDebug --no-daemon --warning-mode=summary 2>&1 | tee build.log; then exit 0; fi
          {
            echo "## ❌ Errores de compilación"
            echo '```'
            grep -E "^e: |error:|¿Qué salió mal?" -A3 build.log | grep -v "^--$" | head -n 120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: " build.log | head -n 40 | while read -r line; do echo "::error::${line}"; done
          grep -A6 "Qué salió mal" build.log | head -n 30
          Salida 1

      # El APK se publica antes de las pruebas: si alguna prueba falla, el APK sigue disponible.
      - nombre: Publicar el APK
        Usos: acciones/cargar-artefacto@v4
        con:
          nombre: fuckstudy-debug-apk
          ruta: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - nombre: Ejecutar las pruebas unitarias
        directorio de trabajo: ${{ steps.loc.outputs.dir }}
        ejecutar: gradle testDebugUnitTest --no-daemon

      - nombre: Publicar informes
        si: siempre()
        Usos: acciones/cargar-artefacto@v4
        con:
          nombre: informes
          ruta: |
            ${{ steps.loc.outputs.dir }}/app/build/reports/
            ${{ steps.loc.outputs.dir }}/build/reports/
          Si no se encuentran archivos: ignorar
